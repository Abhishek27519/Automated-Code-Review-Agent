spring:
  application:
    name: code-review-agent
  threads:
    virtual:
      enabled: true               # Java 21: LLM calls are slow I/O, so don't hold platform threads

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      timeout: 120s
      max-retries: 3
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
        max-tokens: 8192

review:
  max-input-chars: 20000
  structured-output: prompt       # prompt | native
  validate-schema: true           # self-correcting retry on malformed output

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health